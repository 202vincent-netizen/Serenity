<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serenity 供應鏈股票觀點追蹤</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        // 設定極致純黑與深灰對比
                        pureblack: '#000000',
                        darkcard: '#0a0a0a',
                        bordergray: '#222222'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #000000;
        }
    </style>
</head>
<body class="text-gray-300 font-sans min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto">
        <!-- 網站標題 -->
        <header class="mb-10 border-b border-bordergray pb-6">
            <h1 class="text-3xl md:text-4xl font-bold text-white mb-2 tracking-tight">Serenity 供應鏈觀點追蹤</h1>
            <p class="text-gray-500">自動彙整 X 上 @aleabitoreddit 的 AI 半導體與大盤分析</p>
        </header>

        <!-- 最看好股票區塊 (Top Pick) -->
        <div id="top-pick-container" class="mb-12 p-6 rounded-2xl bg-darkcard border border-yellow-600/30 shadow-[0_0_15px_rgba(202,138,4,0.1)] hidden">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-yellow-500 text-sm font-bold tracking-widest uppercase">🔥 當前最看好標的 (Top Pick)</h2>
                <span class="flex h-3 w-3 relative">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-yellow-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-3 w-3 bg-yellow-500"></span>
                </span>
            </div>
            <div class="flex items-baseline gap-4">
                <span id="top-pick-ticker" class="text-6xl font-black text-white tracking-tighter">--</span>
                <span id="top-pick-count" class="text-yellow-500/70 text-lg font-medium">--</span>
            </div>
            <p class="mt-4 text-gray-400 text-sm border-t border-bordergray pt-4">
                此為系統根據近期貼文語意分析，累計被判定為「看多 (Bullish)」次數最多的核心標的。
            </p>
        </div>

        <!-- 最新觀點列表 -->
        <div class="flex items-center justify-between mb-6">
            <h2 class="text-xl font-bold text-white">最新 AI 解析觀點</h2>
            <span class="text-xs text-gray-600">自動同步中...</span>
        </div>
        
        <div id="insights-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- 觀點卡片會由 JavaScript 動態產生在這裡 -->
        </div>
    </div>

    <script>
        // 包含 NVDA, TSM, 0050, QQQ 等標的的模擬分析資料
        const stockData = [
            {
                date: "2026-09-29",
                ticker: "NVDA",
                stance: "Bullish",
                reasoning: "Blackwell 架構晶片出貨量超乎預期，雲端服務商(CSP)的資本支出未見縮減。",
                post_preview: "Hearing massive upward revisions for Blackwell shipments in Q4. The hyperscaler capex train isn't stopping anytime soon..."
            },
            {
                date: "2026-09-28",
                ticker: "QQQ",
                stance: "Bullish",
                reasoning: "科技巨頭財報亮眼，加上降息循環確立，資金持續湧入納斯達克指數。",
                post_preview: "Macro environment perfectly aligns with tech earnings momentum. QQQ remains the safest vehicle to ride this AI supercycle."
            },
            {
                date: "2026-09-27",
                ticker: "TSM",
                stance: "Bullish",
                reasoning: "2奈米製程(N2)良率突破關鍵門檻，蘋果與輝達已包下首批產能。",
                post_preview: "Supply chain checks confirm TSM's N2 yields have crossed the commercial threshold. Apple and NVDA locking in capacity."
            },
            {
                date: "2026-09-26",
                ticker: "NVDA",
                stance: "Bullish",
                reasoning: "液冷散熱模組(Liquid Cooling)的供應瓶頸已解除，為下半年出貨掃清障礙。",
                post_preview: "The liquid cooling bottleneck we discussed last month is officially resolved. NVDA clearing the runway for H2."
            },
            {
                date: "2026-09-24",
                ticker: "0050",
                stance: "Neutral",
                reasoning: "台積電佔比過高雖有撐盤作用，但非電子族群表現疲軟，指數上檔空間受限。",
                post_preview: "Taiwan market is essentially a TSM derivative right now (0050). Solid floor, but non-tech sectors are dragging the broader index..."
            },
            {
                date: "2026-09-22",
                ticker: "INTC",
                stance: "Bearish",
                reasoning: "代工業務分拆計畫缺乏具體細節，客戶流失率恐將擴大。",
                post_preview: "Intel's foundry spin-off sounds good on paper, but lacks execution details. Fabless clients are getting nervous and looking elsewhere."
            }
        ];

        // 判斷立場對應的顏色與樣式 (純黑背景下的高對比色)
        function getStanceStyle(stance) {
            switch(stance) {
                case 'Bullish': return 'bg-green-500/10 text-green-400 border-green-500/30';
                case 'Bearish': return 'bg-red-500/10 text-red-400 border-red-500/30';
                case 'Neutral': return 'bg-gray-500/10 text-gray-400 border-gray-500/30';
                default: return 'bg-gray-800 text-gray-300 border-gray-700';
            }
        }
        
        function getStanceText(stance) {
            switch(stance) {
                case 'Bullish': return '看多 Bullish';
                case 'Bearish': return '看空 Bearish';
                case 'Neutral': return '中立 Neutral';
                default: return stance;
            }
        }

        // 尋找最看好股票 (Top Pick)
        function findTopPick() {
            const bullishCounts = {};
            let topTicker = null;
            let maxCount = 0;

            stockData.forEach(item => {
                if (item.stance === 'Bullish') {
                    bullishCounts[item.ticker] = (bullishCounts[item.ticker] || 0) + 1;
                    if (bullishCounts[item.ticker] > maxCount) {
                        maxCount = bullishCounts[item.ticker];
                        topTicker = item.ticker;
                    }
                }
            });

            if (topTicker) {
                document.getElementById('top-pick-container').classList.remove('hidden');
                document.getElementById('top-pick-ticker').innerText = topTicker;
                document.getElementById('top-pick-count').innerText = `(近期累計 ${maxCount} 次看多)`;
            }
        }

        // 渲染列表 (改為 Grid 排版)
        function renderList() {
            const listContainer = document.getElementById('insights-list');
            listContainer.innerHTML = '';

            stockData.forEach(item => {
                const stanceStyle = getStanceStyle(item.stance);
                const stanceText = getStanceText(item.stance);
                
                const card = document.createElement('div');
                // 純黑主題下的卡片樣式：極暗的灰色底、細緻的邊框
                card.className = "bg-darkcard rounded-xl p-5 border border-bordergray hover:border-gray-600 transition-all duration-300 flex flex-col h-full";
                card.innerHTML = `
                    <div class="flex justify-between items-center mb-4">
                        <div class="flex items-center gap-3">
                            <span class="text-2xl font-black text-white tracking-tight">${item.ticker}</span>
                            <span class="px-2 py-1 rounded-md text-[10px] font-bold uppercase tracking-wider border ${stanceStyle}">
                                ${stanceText}
                            </span>
                        </div>
                        <span class="text-xs font-mono text-gray-500">${item.date}</span>
                    </div>
                    <p class="text-gray-300 text-sm mb-4 flex-grow leading-relaxed">
                        <span class="text-gray-500 mr-1">⚡ 核心觀點：</span> 
                        ${item.reasoning}
                    </p>
                    <div class="bg-[#050505] p-3 rounded-lg text-xs text-gray-500 italic border border-[#111] break-words">
                        "${item.post_preview}"
                    </div>
                `;
                listContainer.appendChild(card);
            });
        }

        // 網頁載入後執行
        document.addEventListener('DOMContentLoaded', () => {
            findTopPick();
            renderList();
        });
    </script>
</body>
</html>
