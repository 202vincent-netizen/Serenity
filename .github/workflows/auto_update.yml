name: Auto Update Serenity Stocks

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: 下載專案程式碼
        uses: actions/checkout@v4 

      - name: 設定 Python 環境
        uses: actions/setup-python@v5 
        with:
          python-version: '3.10'

      - name: 安裝所需套件
        run: pip install feedparser google-genai

      - name: 執行抓取與 AI 分析程式
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python update_data.py

      - name: 將新資料 JSON 檔推送回 GitHub
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          
          # 加入 if 判斷式：如果檔案存在才 add 與 push
          if [ -f data.json ]; then
            git add data.json
            git commit -m "Auto-update stock data" || echo "No changes to commit"
            git push
          else
            echo "沒有新貼文或 RSS 抓取被阻擋，未產生 data.json，跳過推送。"
          fi
