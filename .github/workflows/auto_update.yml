name: Auto Update Serenity Stocks

on:
  schedule:
    # 設定每 4 小時自動執行一次 (時間格式為 UTC)
    - cron: '0 */4 * * *'
  workflow_dispatch: # 允許在網頁上手動點擊執行

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: 下載專案程式碼
        uses: actions/checkout@v3

      - name: 設定 Python 環境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安裝所需套件
        run: pip install feedparser google-genai

      - name: 執行抓取與 AI 分析程式
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python update_data.py

      - name: 將新資料 JSON 檔推送回 GitHub
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add data.json
          git commit -m "Auto-update stock data" || exit 0
          git push
